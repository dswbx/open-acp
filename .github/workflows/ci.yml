name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run test

  release:
    name: Release
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    needs: [typecheck, lint, test]
    runs-on: macos-latest
    outputs:
      build_env: ${{ steps.version.outputs.build_env }}
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute release version
        id: version
        run: bun run release:compute-version --branch "${GITHUB_REF_NAME}"

      - name: Apply release version
        run: bun run release:apply-version --version "${{ steps.version.outputs.version }}"

      - name: Commit version bump
        id: commit
        run: |
          git add package.json electrobun.config.ts src/shared/appVersion.ts
          if git diff --cached --quiet; then
            echo "No version changes detected."
          else
            git commit -m "chore: release ${{ steps.version.outputs.tag }} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build release artifacts
        run: bun run "${{ steps.version.outputs.build_script }}"
        env:
          ELECTROBUN_RELEASE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/updates
          ELECTROBUN_DEVELOPER_ID: ${{ secrets.ELECTROBUN_DEVELOPER_ID }}
          ELECTROBUN_TEAMID: ${{ secrets.ELECTROBUN_TEAMID }}
          ELECTROBUN_APPLEID: ${{ secrets.ELECTROBUN_APPLEID }}
          ELECTROBUN_APPLEIDPASS: ${{ secrets.ELECTROBUN_APPLEIDPASS }}

      - name: Upload updater artifacts for feed publish
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/*
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          RELEASE_SHA: ${{ steps.commit.outputs.release_sha }}
          RELEASE_TITLE: ${{ steps.version.outputs.release_title }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          assets=()
          while IFS= read -r -d '' file; do
            assets+=("$file")
          done < <(find artifacts -type f -print0)

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No artifacts were produced by the release build." >&2
            exit 1
          fi

          release_args=(
            "$TAG"
            "--target" "$RELEASE_SHA"
            "--title" "$RELEASE_TITLE"
            "--generate-notes"
          )

          if [ "$IS_PRERELEASE" = "true" ]; then
            release_args+=("--prerelease")
          fi

          gh release create "${release_args[@]}" "${assets[@]}"

      - name: Open main-to-develop sync PR
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          existing_pr_number="$(gh pr list --base develop --head main --state open --json number --jq '.[0].number')"
          if [ -n "$existing_pr_number" ]; then
            echo "Sync PR already open: #$existing_pr_number"
            exit 0
          fi

          pr_body="$(cat <<EOF
          ## Summary

          This automated sync PR keeps \`develop\` aligned with the stable release metadata committed on \`main\` for ${TAG}.
          EOF
          )"

          gh pr create \
            --base develop \
            --head main \
            --title "chore: sync main back to develop after ${TAG}" \
            --body "$pr_body"

  publish_update_feed:
    name: Publish Update Feed
    if: github.event_name == 'push' && (github.ref_name == 'develop' || github.ref_name == 'main')
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: artifacts

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish updater feed to gh-pages
        env:
          CHANNEL_PREFIX: ${{ needs.release.outputs.build_env }}
        run: |
          set -euo pipefail

          page_worktree="$RUNNER_TEMP/gh-pages"
          rm -rf "$page_worktree"

          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git worktree add "$page_worktree" origin/gh-pages
          else
            git worktree add -b gh-pages "$page_worktree"
            (
              cd "$page_worktree"
              find . -mindepth 1 -maxdepth 1 \
                ! -name .git \
                -exec rm -rf {} +
            )
          fi

          mkdir -p "$page_worktree/updates"
          bun ./scripts/release/updateFeed.ts \
            --artifacts-dir artifacts \
            --feed-dir "$page_worktree/updates" \
            --channel-prefix "$CHANNEL_PREFIX"

          (
            cd "$page_worktree"
            git add updates
            if git diff --cached --quiet; then
              echo "No updater feed changes to publish."
              exit 0
            fi
            git commit -m "chore: publish ${CHANNEL_PREFIX} update feed [skip ci]"
            git push origin HEAD:gh-pages
          )
