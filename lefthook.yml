pre-commit:
  parallel: true
  jobs:
    - name: prettier
      glob: "*.{ts,tsx,js,jsx,json,md,css,yml,yaml,html}"
      run: bunx prettier --write {staged_files}
      stage_fixed: true
    - name: eslint
      glob: "*.{ts,tsx,js,jsx}"
      run: bunx eslint --fix {staged_files}
      stage_fixed: true
    - name: typecheck
      run: bun run typecheck
    - name: test
      run: bun run test
